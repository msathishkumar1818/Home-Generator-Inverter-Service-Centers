<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client & Technician Portal | Home Generator & Inverter Service Center</title>
  <meta name="description"
    content="Access your equipment service dashboard, AMC contracts, warranty documents, and 24/7 priority emergency dispatch.">
  <link rel="icon" type="image/png" href="assets/images/logo/logo.png">

  <!-- Core Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Shared & Portal Styles -->
  <link rel="stylesheet" href="assets/css/style.css?v=5.2">
  <link rel="stylesheet" href="assets/css/login.css?v=5.2">
</head>

<body class="portal-page">

  <!-- Minimalist Top Navigation -->
  <header class="portal-topbar">
    <div class="portal-topbar-controls">
      <!-- Dark Mode Switcher -->
      <button class="header-icon-btn theme-toggle-btn" type="button" aria-label="Toggle dark mode"
        id="portal-theme-btn">
        <svg class="theme-icon-moon" style="width:18px;height:18px;" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <svg class="theme-icon-sun" style="width:18px;height:18px;display:none;" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>

      <!-- RTL Switcher -->
      <button class="header-icon-btn rtl-toggle-btn" type="button" aria-label="Toggle RTL or LTR layout"
        id="portal-rtl-btn">
        <span class="rtl-btn-text" style="font-size:0.75rem;font-weight:700;">RTL</span>
      </button>
    </div>
  </header>

  <!-- Centered Portal Container -->
  <main class="portal-wrapper">
    <div class="portal-card">

      <!-- Brand Header (Navigates to Home) -->
      <a href="index.html" class="portal-brand" title="Return to Home">
        <img src="assets/images/logo/logo-icon.png" alt="Service Center Logo" class="portal-logo-icon">
        <div class="portal-brand-text">
          <span class="portal-brand-name">Generator &amp; Inverter</span>
          <span class="portal-brand-sub">SERVICE CENTER</span>
        </div>
      </a>

      <!-- Avatar User Icon -->
      <div class="portal-avatar-wrap">
        <div class="portal-avatar-circle">
          <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
      </div>

      <!-- Eyebrow Sub-badge -->
      <div class="portal-eyebrow">
        <span>&mdash; MEMBER PORTAL &mdash;</span>
      </div>

      <!-- Title & Subtitle -->
      <h1 class="portal-heading" id="portal-title">Welcome Back</h1>
      <p class="portal-sub" id="portal-sub">Access your equipment service dashboard, warranty records, and dispatch
        logs.</p>

      <!-- Mode Switcher (Sign In vs Register Account) -->
      <div class="portal-segmented-pill" role="tablist" aria-label="Authentication Type">
        <button type="button" class="portal-pill-btn active" id="pill-login" data-tab="login" role="tab"
          aria-selected="true">
          Sign In
        </button>
        <button type="button" class="portal-pill-btn" id="pill-register" data-tab="register" role="tab"
          aria-selected="false">
          Register Account
        </button>
      </div>

      <!-- Role Selector (Homeowner vs Field Staff) -->
      <div class="portal-role-bar" id="portal-role-bar">
        <button type="button" class="portal-role-tag active" data-role="homeowner">
          Homeowner &amp; Commercial
        </button>
        <button type="button" class="portal-role-tag" data-role="staff">
          Field Engineer / Staff
        </button>
      </div>

      <!-- The Form -->
      <form class="portal-form" id="portal-form" onsubmit="handlePortalSubmit(event)">

        <!-- Full Name (Register Only) -->
        <div class="portal-field register-only-field">
          <div class="portal-field-header">
            <label class="portal-label" for="portal-name">Full Name</label>
          </div>
          <input type="text" id="portal-name" class="portal-input" placeholder="e.g. Robert Vance">
        </div>

        <!-- Phone Number (Register Only) -->
        <div class="portal-field register-only-field">
          <div class="portal-field-header">
            <label class="portal-label" for="portal-phone">Mobile Phone Number</label>
          </div>
          <input type="tel" id="portal-phone" class="portal-input" placeholder="+1 (555) 019-2834">
        </div>

        <!-- Equipment Category (Register Only) -->
        <div class="portal-field register-only-field">
          <div class="portal-field-header">
            <label class="portal-label" for="portal-equip">Primary Backup Equipment</label>
          </div>
          <select id="portal-equip" class="portal-input" style="cursor:pointer;">
            <option value="diesel-gen">Standby Diesel Generator</option>
            <option value="pure-sine">Pure Sine Wave Inverter &amp; Battery Bank</option>
            <option value="solar-hybrid">Solar Hybrid Microgrid</option>
            <option value="commercial-ats">Industrial Automatic Transfer Switch (ATS)</option>
          </select>
        </div>

        <!-- Email Address (Common) -->
        <div class="portal-field">
          <div class="portal-field-header">
            <label class="portal-label" for="portal-email">Email Address</label>
          </div>
          <input type="email" id="portal-email" class="portal-input" placeholder="client@powercare.com" required>
        </div>

        <!-- Password (Common) -->
        <div class="portal-field">
          <div class="portal-field-header">
            <label class="portal-label" for="portal-password">Password</label>
            <a href="#" class="portal-forgot login-only-field"
              onclick="alert('Password reset instructions sent to your registered email address.'); return false;">Forgot?</a>
          </div>
          <div class="portal-pass-wrap">
            <input type="password" id="portal-password" class="portal-input"
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
            <button type="button" class="portal-eye-btn" id="toggle-password-btn"
              aria-label="Toggle password visibility">
              <!-- Eye Icon (Open) -->
              <svg class="eye-icon-open" style="width:18px;height:18px;" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye Icon (Closed) -->
              <svg class="eye-icon-closed" style="width:18px;height:18px;display:none;" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password (Register Only) -->
        <div class="portal-field register-only-field">
          <div class="portal-field-header">
            <label class="portal-label" for="portal-confirm-password">Confirm Password</label>
          </div>
          <input type="password" id="portal-confirm-password" class="portal-input"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
        </div>

        <!-- Remember Me Checkbox -->
        <div class="portal-remember-row login-only-field">
          <input type="checkbox" id="portal-remember" class="portal-checkbox" checked>
          <label for="portal-remember" class="portal-checkbox-label">Remember my device for 30 days</label>
        </div>

        <!-- Terms agreement (Register Only) -->
        <div class="portal-remember-row register-only-field">
          <input type="checkbox" id="portal-terms" class="portal-checkbox" checked required>
          <label for="portal-terms" class="portal-checkbox-label">I agree to the Service Terms &amp; AMC Privacy
            Protocol</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="portal-submit-btn" id="portal-submit-btn">
          Sign In to Portal
        </button>

      </form>

      <!-- Bottom Assistance Link -->
      <div class="portal-bottom-helper">
        <p id="portal-helper-text">Need immediate emergency assistance?</p>
        <a href="contact.html" class="portal-consult-link" id="portal-helper-link">
          <span>Book Emergency Dispatch</span>
          <svg style="width:14px;height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
      </div>

    </div>

    <!-- Copyright -->
    <p class="portal-footer">&copy; 2026 Generator &amp; Inverter Service Center. All rights reserved.</p>
  </main>

  <!-- Interactive Logic Script -->
  <script>
    // ----------------------------------------------------
    // Dark Mode Sync with Site
    // ----------------------------------------------------
    const themeBtn = document.getElementById('portal-theme-btn');
    const sunIcon = themeBtn.querySelector('.theme-icon-sun');
    const moonIcon = themeBtn.querySelector('.theme-icon-moon');

    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        sunIcon.style.display = 'inline-block';
        moonIcon.style.display = 'none';
      } else {
        document.documentElement.classList.remove('dark');
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'inline-block';
      }
    }

    const savedTheme = localStorage.getItem('site_theme');
    applyTheme(savedTheme === 'dark');

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(!isDark);
      localStorage.setItem('site_theme', !isDark ? 'dark' : 'light');
    });

    // ----------------------------------------------------
    // RTL / LTR Sync with Site
    // ----------------------------------------------------
    const rtlBtn = document.getElementById('portal-rtl-btn');
    const rtlText = rtlBtn.querySelector('.rtl-btn-text');

    function applyDirection(dir) {
      document.documentElement.setAttribute('dir', dir);
      rtlText.textContent = dir === 'rtl' ? 'LTR' : 'RTL';
      localStorage.setItem('site_dir', dir);
    }

    const savedDir = localStorage.getItem('site_dir') || 'ltr';
    applyDirection(savedDir);

    rtlBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('dir');
      applyDirection(current === 'rtl' ? 'ltr' : 'rtl');
    });

    // ----------------------------------------------------
    // Tab Switching (Sign In vs Register)
    // ----------------------------------------------------
    const pillLogin = document.getElementById('pill-login');
    const pillRegister = document.getElementById('pill-register');
    const portalTitle = document.getElementById('portal-title');
    const portalSub = document.getElementById('portal-sub');
    const submitBtn = document.getElementById('portal-submit-btn');
    const helperText = document.getElementById('portal-helper-text');
    const helperLink = document.getElementById('portal-helper-link');

    function setAuthMode(mode) {
      if (mode === 'register') {
        document.body.classList.add('register-mode');
        pillLogin.classList.remove('active');
        pillLogin.setAttribute('aria-selected', 'false');
        pillRegister.classList.add('active');
        pillRegister.setAttribute('aria-selected', 'true');

        portalTitle.textContent = 'Create an Account';
        portalSub.textContent = 'Register your equipment for 24/7 priority emergency dispatch and AMC coverage.';
        submitBtn.textContent = 'Register Client Account';
        helperText.textContent = 'Already have an existing service account?';
        helperLink.innerHTML = '<span>Sign In to Your Dashboard</span> &rarr;';
        helperLink.onclick = (e) => { e.preventDefault(); setAuthMode('login'); };
      } else {
        document.body.classList.remove('register-mode');
        pillRegister.classList.remove('active');
        pillRegister.setAttribute('aria-selected', 'false');
        pillLogin.classList.add('active');
        pillLogin.setAttribute('aria-selected', 'true');

        portalTitle.textContent = 'Welcome Back';
        portalSub.textContent = 'Access your equipment service dashboard, warranty records, and dispatch logs.';
        submitBtn.textContent = 'Sign In to Portal';
        helperText.textContent = 'Need immediate emergency assistance?';
        helperLink.innerHTML = '<span>Book Emergency Dispatch</span> &rarr;';
        helperLink.onclick = null;
        helperLink.href = 'contact.html';
      }
    }

    pillLogin.addEventListener('click', () => setAuthMode('login'));
    pillRegister.addEventListener('click', () => setAuthMode('register'));

    // Check URL parameters (e.g. login.html?mode=register)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'register') {
      setAuthMode('register');
    }

    // ----------------------------------------------------
    // Role Switching (Homeowner vs Staff)
    // ----------------------------------------------------
    const roleTags = document.querySelectorAll('.portal-role-tag');
    roleTags.forEach(tag => {
      tag.addEventListener('click', () => {
        roleTags.forEach(t => t.classList.remove('active'));
        tag.classList.add('active');
      });
    });

    // ----------------------------------------------------
    // Password Visibility Toggle
    // ----------------------------------------------------
    const passInput = document.getElementById('portal-password');
    const eyeBtn = document.getElementById('toggle-password-btn');
    const eyeOpen = eyeBtn.querySelector('.eye-icon-open');
    const eyeClosed = eyeBtn.querySelector('.eye-icon-closed');

    eyeBtn.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      eyeOpen.style.display = isPass ? 'none' : 'inline-block';
      eyeClosed.style.display = isPass ? 'inline-block' : 'none';
    });

    // ----------------------------------------------------
    // Form Submit Handler
    // ----------------------------------------------------
    function handlePortalSubmit(e) {
      e.preventDefault();
      const isRegister = document.body.classList.contains('register-mode');
      const email = document.getElementById('portal-email').value;

      if (isRegister) {
        const name = document.getElementById('portal-name').value || 'Customer';
        alert(`Thank you, ${name}! Your account for ${email} has been provisioned. Redirecting to your service dashboard...`);
      } else {
        alert(`Welcome back! Successfully authenticated for ${email}. Accessing service dashboard...`);
      }

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    }
  </script>

</body>

</html>
